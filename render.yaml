services:
  - type: web
    name: promptshelf-backend
    runtime: node
    plan: free
    rootDir: promptshelf-backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
